# .gitlab/flows/compliance-flow.yaml
name: "ComplianceBot Flow"
description: "Multi-agent compliance flow that scans MRs, maps findings to controls, collects audit evidence, and generates reports"
public: true
definition:
  version: v1
  environment: ambient
  
  triggers:
    - type: merge_request
      events:
        - opened
        - updated
    - type: pipeline
      events:
        - success
        - failed
      branches:
        - main
        - production
    - type: schedule
      cron: "0 2 * * 1"  # Every Monday at 2 AM UTC
  
  components:
    - name: scanner
      type: AgentComponent
      prompt_id: "compliance-scanner"
      inputs:
        - "context:merge_request_diff"
        - "context:pipeline_results"
      toolset: ["read_file", "read_files", "analyze_file_diff"]
      ui_log_events:
        - on_agent_final_answer

    - name: mapper
      type: AgentComponent
      prompt_id: "compliance-mapper"
      inputs:
        - "from:scanner"
      toolset: ["read_file", "execute_query", "log_analysis"]
      ui_log_events:
        - on_agent_final_answer

    - name: evidence_collector
      type: AgentComponent
      prompt_id: "evidence-collector"
      inputs:
        - "from:mapper"
        - "context:project"
      toolset: ["read_file", "execute_query", "archive_data", "generate_hash"]
      ui_log_events:
        - on_agent_final_answer

    - name: reporter
      type: AgentComponent
      prompt_id: "compliance-reporter"
      inputs:
        - "from:evidence_collector"
      toolset: ["read_file", "create_issue", "post_comment", "generate_pdf", "archive_file"]
      ui_log_events:
        - on_agent_final_answer

  outputs:
    - type: gitlab_issue
      title: "Compliance Report: {{ trigger.source.branch | default('automated') }}"
      labels:
        - compliance
        - automated
      from: reporter
    
    - type: mr_comment
      condition: "trigger.type == 'merge_request' && components.reporter.score < 85"
      from: reporter
    
    - type: ci_artifact
      path: "reports/compliance-report.pdf"
      expire_in: "90 days"
      from: reporter
