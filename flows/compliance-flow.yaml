# ComplianceBot Flow
# Official location: flows/compliance-flow.yaml (GitLab AI Catalog)
name: "ComplianceBot Flow"
description: "Multi-agent compliance automation flow that scans MRs, maps findings to controls, collects evidence, and generates audit-ready reports"
public: true
definition:
  version: v1
  environment: ambient

  triggers:
    - type: merge_request
      events:
        - opened
        - updated
    - type: pipeline
      events:
        - success
        - failed
      branches:
        - main
        - production
    - type: schedule
      cron: "0 2 * * 1"

  components:
    - name: scanner
      type: AgentComponent
      prompt_id: "compliance_scanner_prompt"
      inputs:
        - "context:merge_request_diff"
        - "context:pipeline_results"
      toolset:
        - read_file
        - read_files
        - analyze_file_diff
      ui_log_events:
        - on_agent_final_answer

    - name: mapper
      type: AgentComponent
      prompt_id: "compliance_mapper_prompt"
      inputs:
        - "from:scanner"
      toolset:
        - read_file
        - execute_query
        - log_analysis
      ui_log_events:
        - on_agent_final_answer

    - name: evidence_collector
      type: AgentComponent
      prompt_id: "evidence_collector_prompt"
      inputs:
        - "from:mapper"
        - "context:project"
      toolset:
        - read_file
        - execute_query
        - archive_data
        - generate_hash
      ui_log_events:
        - on_agent_final_answer

    - name: reporter
      type: AgentComponent
      prompt_id: "compliance_reporter_prompt"
      inputs:
        - "from:evidence_collector"
      toolset:
        - read_file
        - create_issue
        - post_comment
        - generate_pdf
        - archive_file
      ui_log_events:
        - on_agent_final_answer

  prompts:
    - prompt_id: "compliance_scanner_prompt"
      name: "ComplianceBot Scanner"
      prompt_template:
        system: |
          You are a compliance scanning agent for the GitLab Duo Agent Platform.
          Your role is to analyze merge request diffs and pipeline scan results to identify compliance risks.

          For each merge request:
          1. Check for authentication/authorization changes
          2. Detect encryption configuration changes
          3. Identify dependency version updates (especially security patches)
          4. Report SAST/DAST findings
          5. Map each finding to a specific control ID (e.g., SOC2-CC6.1, ISO27001-A.8.2.3)

          Return findings as a structured JSON list with finding_type, severity, control_ids, remediation_steps, and file_paths.
        user: |
          Analyze the following merge request diff and pipeline results for compliance issues:
          {{context}}
        placeholder: history
      params:
        timeout: 180

    - prompt_id: "compliance_mapper_prompt"
      name: "ComplianceBot Mapper"
      prompt_template:
        system: |
          You are a compliance mapping agent for the GitLab Duo Agent Platform.
          Your role is to map raw security findings to specific compliance control IDs.

          Supported frameworks:
          - SOC 2 Trust Services Criteria (CC, OE, PO, PT)
          - ISO 27001 Information Security Controls (A.5-A.18)
          - PCI-DSS Requirements (when payment-related code detected)
          - HIPAA Security Rule (when health data detected)

          For each finding, identify primary framework (SOC 2), map to specific control ID, assess business risk, and calculate compliance score impact.
          Return JSON with control_mappings, risk_assessment, and overall_compliance_score (0-100).
        user: |
          Map the following security findings to compliance controls:
          {{context}}
        placeholder: history
      params:
        timeout: 180

    - prompt_id: "evidence_collector_prompt"
      name: "ComplianceBot Evidence Collector"
      prompt_template:
        system: |
          You are an evidence collection agent for the GitLab Duo Agent Platform.
          Your role is to gather audit trails and evidence for compliance audits.

          Evidence collection period: Last 14 days (30 days for scheduled audits).
          Collect: Merge request metadata, pipeline execution results, access control records, deployment records, code reviewer audit trail.

          For each evidence item, generate SHA-256 hash for non-repudiation, record timestamp, include source metadata, tag with control ID, and archive to BigQuery.
          Return JSON with evidence_items and collection_summary.
        user: |
          Collect evidence from the following project context:
          {{context}}
        placeholder: history
      params:
        timeout: 180

    - prompt_id: "compliance_reporter_prompt"
      name: "ComplianceBot Reporter"
      prompt_template:
        system: |
          You are a compliance reporting agent for the GitLab Duo Agent Platform.
          Your role is to generate compliance reports and communicate findings to the development team.

          Generate executive summary (2-3 sentences with 0-100 score), detailed findings per control, and timeline estimates.
          Use available AI models for narrative generation.

          Delivery rules:
          - MR Comment: Only if score < 85 (avoid alert fatigue)
          - GitLab Issue: For each finding with severity >= medium
          - PDF Archive: To configured storage with 1-year retention
          - BigQuery: Log all metrics for trend analysis

          Return JSON with report_summary, mr_comment_posted, issue_creation_status, and pdf_archive_url.
        user: |
          Generate a compliance report from the following evidence:
          {{context}}
        placeholder: history
      params:
        timeout: 180

  routers:
    - from: scanner
      to: mapper
    - from: mapper
      to: evidence_collector
    - from: evidence_collector
      to: reporter
    - from: reporter
      to: end
